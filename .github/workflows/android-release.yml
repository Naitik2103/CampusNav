name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'   # Triggers on any tag like v1.0.0, v1.0.1, v2.0.0 etc.

jobs:
  build-and-release:
    name: Build APK and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java (required by Gradle / Android build tools) ───────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── 3. Flutter ────────────────────────────────────────────────────────────
      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # ── 4. Dependencies ───────────────────────────────────────────────────────
      - name: Install Flutter dependencies
        working-directory: new_project
        run: flutter pub get

      # ── 5. Extract version from tag (v1.0.1 → 1.0.1) ────────────────────────
      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (tag: $TAG)"

      # ── 6. Build release APK ──────────────────────────────────────────────────
      - name: Build release APK
        working-directory: new_project
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.VERSION }}" \
            --build-number="${{ github.run_number }}"

      # ── 7. Rename APK to include version ─────────────────────────────────────
      - name: Rename APK
        run: |
          mv new_project/build/app/outputs/flutter-apk/app-release.apk \
             new_project/build/app/outputs/flutter-apk/CampusNav-${{ steps.version.outputs.TAG }}.apk

      # ── 8. Create GitHub Release & upload APK ────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "CampusNav ${{ steps.version.outputs.TAG }}"
          body: |
            ## 🎓 CampusNav ${{ steps.version.outputs.TAG }}

            ### Install
            1. Download **CampusNav-${{ steps.version.outputs.TAG }}.apk** below
            2. Open the file on your Android device
            3. Tap **Install** (allow unknown sources if prompted)

            ---
            *Built automatically from source on ${{ github.run_id }}*
          files: |
            new_project/build/app/outputs/flutter-apk/CampusNav-${{ steps.version.outputs.TAG }}.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
